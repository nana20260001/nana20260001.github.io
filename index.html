<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动物定制作画 - PetArt Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #fff; color: #333; }
  a { text-decoration: none; color: inherit; }

  /* --- 首屏 Hero Banner (还原截图) --- */
  .hero {
    position: relative;
    background-color: #9ca4d3; /* 截图中的紫蓝色背景 */
    height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .hero-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1100px;
    width: 100%;
    padding: 0 40px;
    z-index: 2;
  }
  /* 左侧文字区 */
  .hero-text {
    flex: 1;
    color: #fff;
    max-width: 450px;
  }
  .hero-text h1 {
    font-size: 42px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 15px;
    letter-spacing: 2px;
  }
  .hero-text p {
    font-size: 16px;
    margin-bottom: 30px;
    opacity: 0.9;
  }
  .hero-btn {
    display: inline-block;
    background-color: #f67280; /* 截图中粉红色按钮 */
    color: #fff;
    padding: 12px 35px;
    border-radius: 25px;
    font-size: 15px;
    font-weight: bold;
    transition: background 0.3s;
  }
  .hero-btn:hover { background-color: #e65f6d; }

  /* 右侧图片区 */
  .hero-image {
    flex: 1;
    display: flex;
    justify-content: flex-end;
    position: relative;
  }
  .hero-image img {
    width: 100%;
    max-width: 500px;
    border-radius: 4px;
    box-shadow: -15px 20px 40px rgba(0,0,0,0.3); /* 截图中的立体阴影 */
    transform: perspective(1000px) rotateY(-5deg); /* 微弱的3D倾斜感 */
    border: 8px solid #fff; /* 模拟画框 */
    object-fit: cover;
    height: 320px;
  }
  /* 模拟截图中的 Ultra HD 图标 */
  .ultra-badge {
    position: absolute;
    top: -20px;
    left: 20px;
    background: #000;
    color: #fff;
    border: 2px solid #ff00ff;
    border-radius: 4px;
    padding: 8px 12px;
    text-align: center;
    box-shadow: 0 0 15px rgba(255,0,255,0.6);
    z-index: 10;
  }
  .ultra-badge div:first-child { font-size: 12px; font-weight: bold; letter-spacing: 1px; }
  .ultra-badge div:last-child { font-size: 22px; font-weight: 900; color: #ffff00; line-height: 1; }

  /* 底部细线条轮播指示器 */
  .hero-dots {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
  }
  .hero-dots span {
    display: block;
    width: 40px;
    height: 3px;
    background-color: rgba(255,255,255,0.4);
    cursor: pointer;
    transition: background 0.3s;
  }
  .hero-dots span.active { background-color: #ff6b81; }

  /* 左右大箭头 */
  .hero-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.6);
    font-size: 40px;
    cursor: pointer;
    z-index: 10;
    font-weight: 300;
    user-select: none;
    padding: 20px;
  }
  .hero-arrow:hover { color: #fff; }
  .arrow-left { left: 20px; }
  .arrow-right { right: 20px; }

  /* --- 悬浮 WhatsApp 按钮 --- */
  .whatsapp-float {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 50px;
    height: 50px;
    background-color: #25d366;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    z-index: 100;
    transition: transform 0.2s;
  }
  .whatsapp-float:hover { transform: scale(1.1); }
  .whatsapp-float svg { width: 28px; height: 28px; fill: #fff; }

  /* --- 热门产品区 --- */
  .section-container { max-width: 1100px; margin: 0 auto; padding: 50px 20px; }
  .section-title { text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 30px; color: #333; }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
  .product-card { background: #fff; border: 1px solid #eee; border-radius: 8px; overflow: hidden; transition: box-shadow 0.3s; }
  .product-card:hover { box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
  .product-card .thumb { height: 200px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 14px; }
  .product-card .info { padding: 15px; text-align: center; }
  .product-card .name { font-size: 15px; font-weight: 500; margin-bottom: 8px; }
  .product-card .price { color: #f67280; font-weight: bold; font-size: 16px; }

  /* --- 紧凑版 Footer (不占空间) --- */
  .compact-footer { background: #222; color: #999; padding: 30px 20px; text-align: center; font-size: 13px; line-height: 2; }
  .compact-footer a { color: #ccc; margin: 0 10px; }
  .compact-footer a:hover { color: #fff; }
  .compact-footer .copyright { margin-top: 15px; font-size: 12px; color: #666; }
</style>
</head>
<body>

<!-- 首屏 Hero 区域 -->
<div class="hero">
  <div class="hero-arrow arrow-left">＜</div>
  <div class="hero-arrow arrow-right">＞</div>

  <div class="hero-content">
    <div class="hero-text">
      <h1>高端动物定制作画</h1>
      <p>完美呈现宠物的神态与细节，高端艺术微喷</p>
      <a href="#products" class="hero-btn">查看订制</a>
    </div>
    
    <div class="hero-image">
      <!-- Ultra HD 标识 -->
      <div class="ultra-badge">
        <div>ultra</div>
        <div>HD</div>
        <div>PRINT</div>
      </div>
      <!-- 右侧占位图，请替换为你的真实画作图片 src -->
      <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="宠物画作示例">
    </div>
  </div>

  <!-- 底部指示器 -->
  <div class="hero-dots">
    <span></span>
    <span></span>
    <span class="active"></span>
    <span></span>
    <span></span>
  </div>
</div>

<!-- 悬浮 WhatsApp -->
<a href="https://wa.me/你的WhatsApp号码" target="_blank" class="whatsapp-float">
  <svg viewBox="0 0 32 32"><path d="M16 2a14 14 0 0 0-12.1 21l-2 7.3 7.5-2A14 14 0 1 0 16 2zm0 25.5a11.5 11.5 0 0 1-5.9-1.6l-.4-.2-4.4 1.2 1.2-4.3-.3-.4A11.5 11.5 0 1 1 16 27.5zm6.3-8.6c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.7.2s-.8 1-.9 1.2c-.2.2-.3.2-.6.1-1.8-.9-3-1.6-4.2-3.6-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5s-.7-1.7-1-2.3c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.6 6.3 6.3 0 0 0 1.3 3.3 14.3 14.3 0 0 0 5.5 4.8c2 .8 2.8.9 3.8.7a3.2 3.2 0 0 0 2.1-1.5 2.6 2.6 0 0 0 .2-1.5c-.1-.2-.3-.3-.7-.5z"/></svg>
</a>

<!-- 热门产品区 -->
<div class="section-container" id="products">
  <div class="section-title">熱門產品</div>
  <div class="grid">
    <div class="product-card">
      <div class="thumb">猫咪水彩作品图</div>
      <div class="info">
        <div class="name">猫咪水彩肖像定制</div>
        <div class="price">¥ 199</div>
      </div>
    </div>
    <div class="product-card">
      <div class="thumb">狗狗油画作品图</div>
      <div class="info">
        <div class="name">狗狗油画肖像定制</div>
        <div class="price">¥ 259</div>
      </div>
    </div>
    <div class="product-card">
      <div class="thumb">鹦鹉插画作品图</div>
      <div class="info">
        <div class="name">鹦鹉插画定制</div>
        <div class="price">¥ 159</div>
      </div>
    </div>
    <div class="product-card">
      <div class="thumb">狮子素描作品图</div>
      <div class="info">
        <div class="name">狮子素描定制</div>
        <div class="price">¥ 299</div>
      </div>
    </div>
  </div>
</div>

<!-- 紧凑版 Footer -->
<footer class="compact-footer">
  <div>
    <a href="#">关于我们</a> | 
    <a href="#">订购流程</a> | 
    <a href="#">联系我们</a> | 
    <a href="mailto:你的邮箱@example.com">你的邮箱@example.com</a>
  </div>
  <div class="copyright">
    © 2026 PetArt Studio 动物定制作画. All rights reserved.
  </div>
</footer>

<script>
  // 简易首屏轮播指示器点击切换效果
  var dots = document.querySelectorAll('.hero-dots span');
  for (var i = 0; i < dots.length; i++) {
    dots[i].addEventListener('click', function() {
      for (var j = 0; j < dots.length; j++) {
        dots[j].classList.remove('active');
      }
      this.classList.add('active');
    });
  }
</script>

</body>
</html>
